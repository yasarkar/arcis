[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
fs_permissions = [{ access = "read-write", path = "./out"}]
via_ir = false

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.arc.io"

[etherscan]
arc_testnet = { key = "verify", url = "https://testnet.arcscan.app/api/" }
arc_mainnet = { key = "verify", url = "https://arcscan.app/api/" }

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"